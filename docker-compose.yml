# Tingly Box — Docker Compose deployment
# Uses upstream ghcr.io/tingly-dev/tingly-box image extended with dev tools + agent CLIs.
#
# Volumes:
#   ./data/.tingly-box/  → persistent data home (config.json, db, keys, guardrails, etc.)
#   ./data/memory/       → memory store
#   ./data/logs/         → log files
#   ./data/.claude/      → Claude Code OAuth tokens
#   ./data/.codex/       → Codex OAuth tokens
#   ./data/mcp/          → workspace for any MCP tools you install inside the container
#
# Environment:
#   All settings via .env file (see .env.example). Copy to .env and customize.
#   If your config.json references additional env vars, add them to .env
#   and pass them through in the environment section below.

services:
  tingly-box:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TINGLY_VERSION: "${TINGLY_VERSION:-latest}"
    image: tingly-box-docker:local
    container_name: tingly-box
    ports:
      - "${TINGLY_PORT:-12580}:12580"
      # For Codex and Claude Code auth must use codes and not link callbacks unless swith to host networking by running the apps inside the container and opening the login links in a browser
      #  or else use network_mode: host and change callback url manually point to the host machine's IP address (not localhost) allowing for reauth inside Tingly web UI
    volumes:
      # Persistent data — survives container rebuilds
      # This is the tingly-box data home (config.json, db, keys, guardrails, etc.)
      - ./data/.tingly-box:/app/.tingly-box
      - ./data/memory:/app/memory
      - ./data/logs:/app/logs

      # Claude Code and Codex OAuth token storage (persisted across restarts)
      - ./data/.claude:/home/tingly/.claude
      - ./data/.codex:/home/tingly/.codex

      # MCP tools workspace — clone/install MCP servers here, persist across rebuilds
      - ./data/mcp:/app/mcp

      # uv/pip user installs persisted across rebuilds
      - ./data/.local:/home/tingly/.local
    environment:
      - TINGLY_HOST=${TINGLY_HOST:-0.0.0.0}
      - TINGLY_PORT=12580
      - TINGLY_DEBUG=${TINGLY_DEBUG:-false}
      # Pass through any additional env vars from .env file
      # Add your API keys and MCP tool settings to .env, then uncomment
      # the lines below or add your own:
      # - SERPER_API_KEY=${SERPER_API_KEY:-}
      # - BRAVE_API_KEY=${BRAVE_API_KEY:-}
      # - MY_CUSTOM_VAR=${MY_CUSTOM_VAR:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "tingly-box", "version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # VisionBridge — gives text-only LLMs vision through an OpenAI-compatible proxy.
  # Reasoning + vision both route through tingly-box (below) so routing, OAuth,
  # rate limits and usage tracking all stay in one place. VisionBridge itself is
  # NOT exposed to clients; they reach it via the tingly-box visionbridge model.
  # Built from source via visionbridge.Dockerfile (no released image exists yet),
  # pinned to VISIONBRIDGE_SHA. All settings come from .env (see .env.example).
  visionbridge:
    build:
      context: .
      dockerfile: visionbridge.Dockerfile
      args:
        VISIONBRIDGE_SHA: "${VISIONBRIDGE_SHA:-92c793feaee0}"
    image: visionbridge:local
    container_name: visionbridge
    # Internal only — clients never reach VisionBridge directly, only via
    # tingly-box. The host port is optional for debugging.
    # ports:
    #   - "${VISIONBRIDGE_PORT:-8080}:8080"
    environment:
      # Reasoning backend = tingly-box OpenAI-compatible endpoint (service name)
      REASONING_BASE_URL: "http://tingly-box:12580/tingly/${VISIONBRIDGE_SCENARIO:-custom}/v1"
      REASONING_API_KEY: "${TINGLY_MODEL_TOKEN:?TINGLY_MODEL_TOKEN must be set}"
      REASONING_MODEL: "${VISIONBRIDGE_REASONING_MODEL:-z.ai/glm-5.3}"
      # Vision backend = same tingly-box, vision-capable model rule
      VISION_BASE_URL: "http://tingly-box:12580/tingly/${VISIONBRIDGE_SCENARIO:-custom}/v1"
      VISION_API_KEY: "${TINGLY_MODEL_TOKEN:?TINGLY_MODEL_TOKEN must be set}"
      VISION_MODEL: "${VISIONBRIDGE_VISION_MODEL:-ollama/qwen3.5:397b}"
      # The model name VisionBridge advertises; clients request this through tingly-box
      BRIDGE_MODEL_NAME: "${VISIONBRIDGE_MODEL_NAME:-visionbridge}"
      SCENE_PRIMING: "${VISIONBRIDGE_SCENE_PRIMING:-true}"
      MAX_VISION_CALLS: "${VISIONBRIDGE_MAX_VISION_CALLS:-8}"
      TOOL_MODE: "${VISIONBRIDGE_TOOL_MODE:-auto}"
    restart: unless-stopped
    depends_on:
      - tingly-box